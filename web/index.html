<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Зоосалон — учёт питомцев, владельцев и филиалов">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Зоосалон">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Зоосалон</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #e0f2f1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Экран-заглушка до первого кадра Flutter */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #00695c;
      background: #e0f2f1;
      transition: opacity 0.35s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash .title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #splash .hint {
      font-size: 14px;
      color: #4db6ac;
    }

    #splash .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #b2dfdb;
      border-top-color: #00695c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="title">Зоосалон</div>
    <div class="spinner"></div>
    <div class="hint">Загрузка…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 400);
    });
  </script>
</body>
</html>
